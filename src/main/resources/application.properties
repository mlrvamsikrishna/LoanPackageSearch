spring.application.name=LoanPackageSearch
# Server Configuration
server.port=8080
server.servlet.context-path=/

# Default seed data location (override with LOAN_DATA_ROOT if needed)
app.data-root=${LOAN_DATA_ROOT:./data}
app.seed-file=loan-package-seed.txt

# Application Name and Version
spring.application.name=Loan Package Search

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.loanpackagesearch=DEBUG

# Thymeleaf Template Configuration
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Web Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/

# Disable Spring Boot actuator endpoints by default
management.endpoints.web.exposure.exclude=*
